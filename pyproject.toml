[tool.pytest.ini_options]
testpaths = ["services/match/tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["melee", "node_modules", "data"]

[tool.ruff.lint]
# 基础正确性（F 系列 / E9）+ import 顺序（I）+ 常见陷阱（B）。
# 之前只开 5 条，实测漏掉 25 处 import 乱序与 8 处 zip(strict=) / raise-from；
# 规则不开等于没人守，开了才能在 CI 拦住同类问题。
select = ["F", "E9", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# 测试里常有意保留未用的 fixture 依赖
"services/match/tests/*" = ["F401", "F811"]

[tool.bandit]
# 低危项（B101 assert、B404/B603 subprocess）已在人工审查中逐条确认：
# assert 只用于测试与内部不变量；subprocess 只调用本机 ffmpeg 与固定脚本。
exclude_dirs = ["services/match/tests", "scripts", "melee", "data"]
skips = ["B101"]

[tool.coverage.run]
source = ["services/match"]
# 覆盖率只统计产品代码；测试文件自身被计入会把总数稀释到 52%。
omit = ["services/match/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
