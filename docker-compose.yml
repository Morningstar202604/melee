services:
  match:
    build: .
    # 不直接对外暴露端口：外部请求统一经 web（Caddy 反代）进入，
    # 保证前端与 API 同源——前端默认按同源发 /stats、/archive、SSE，
    # 之前两个端口分开、Caddy 只做静态文件，所有 API 调用都会 404。
    expose:
      - "8099"
    environment:
      MELEE_DB: /data/match.db
      MELEE_AUTH: "off"
      # 生产请改成 token 并设置 MELEE_API_TOKENS / MELEE_SECRET_KEY
      # MELEE_AUTH: token
      # MELEE_API_TOKENS: "alice:change-me"
      # MELEE_SECRET_KEY: "用 python -m services.match.secrets --gen 生成"
      MELEE_BROADCAST: memory
      # MELEE_BROADCAST: redis
      # MELEE_REDIS_URL: redis://redis:6379/0
      MELEE_RATELIMIT: memory
      MELEE_TRUSTED_PROXY_HOPS: "0"
      # 单机演示默认不配密钥：队列里的选手 Key 会退化为明文。
      # 生产必须设置（python -m services.match.secrets --gen），并同时配 TICKET_SECRET，
      # 否则多副本各自随机签名，票据互不认。
      # MELEE_SECRET_KEY: "用 python -m services.match.secrets --gen 生成"
      # MELEE_TICKET_SECRET: "另一把随机串，多副本必须一致"
      # MELEE_SCHEDULE: "demo-2026"
      # MELEE_SCHEDULE_INTERVAL: "120"
    volumes:
      - melee-data:/data
    restart: unless-stopped

  web:
    image: caddy:2-alpine
    ports:
      - "8088:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - match
    restart: unless-stopped

volumes:
  melee-data:
