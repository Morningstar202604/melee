<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>melee · 赛季</title>
<link rel="stylesheet" href="./src/theme.css">
<style>
.board{display:grid;grid-template-columns:1fr 320px;gap:14px;margin-top:16px}
@media (max-width:820px){.board{grid-template-columns:1fr}}
.rank{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #161B25}
.rank:last-child{border-bottom:none}
.thead{display:flex;gap:12px;font-size:10px;letter-spacing:.1em;color:var(--faint);text-transform:uppercase;padding-bottom:8px;border-bottom:1px solid #161B25}
.thead span:nth-child(1){width:26px}
.thead span:nth-child(2){flex:1}
.thead span:nth-child(3),.thead span:nth-child(4){width:34px;text-align:right}
.thead span:nth-child(5){width:64px;text-align:right}
.rank .no{width:26px;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.rank .nm{flex:1;color:#E8EAF2;font-weight:600;font-size:13.5px}
.rank .w{width:34px;text-align:right;color:var(--ok);font-variant-numeric:tabular-nums}
.rank .l{width:34px;text-align:right;color:var(--bad);font-variant-numeric:tabular-nums}
.rank .r{width:64px;text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
.fixture{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #12161F;font-size:12.5px;color:var(--dim)}
.fixture:last-child{border-bottom:none}
.fixture .rd{width:44px;color:var(--faint);font-size:11px}
.error{color:var(--bad);font-size:13px;margin-top:10px}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">MELEE <span>/</span> 赛季</div>
  <nav class="nav">
    <a href="./index.html">观战</a>
    <a href="./season.html" class="on">赛季</a>
    <a href="./recap.html">战报</a>
    <a href="./director.html">导播</a>
  </nav>
</div>

<div class="wrap">
  <h1 id="title">赛季</h1>
  <p class="muted" id="subtitle">加载中…</p>
  <div class="card" id="nextUp" style="display:none;margin-top:12px">
    <span class="muted">即将开赛</span>
    <b id="nextUpText" style="margin-left:10px"></b>
  </div>

  <div class="board">
    <div class="card">
      <h2 style="margin-top:0">积分榜</h2>
      <div class="thead"><span>#</span><span>选手</span><span>胜</span><span>负</span><span>积分</span></div>
      <div id="standings"><div class="muted">加载中…</div></div>
    </div>
    <div>
      <div class="card" style="margin-bottom:14px">
        <h2 style="margin-top:0">宿敌</h2>
        <div id="rivalries"><div class="muted">暂无（需交手 2 场以上）</div></div>
      </div>
      <div class="card">
        <h2 style="margin-top:0">赛程</h2>
        <div id="fixtures" style="max-height:320px;overflow:auto"><div class="muted">加载中…</div></div>
      </div>
    </div>
  </div>
  <div class="error" id="error"></div>
</div>

<script type="module" src="./src/season.js"></script>
</body>
</html>
