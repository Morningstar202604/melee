<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
<title>Admin · melee broadcast</title>
<link rel="stylesheet" href="./src/theme.css">
<style>
.ops-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
@media (max-width:900px){.ops-grid{grid-template-columns:repeat(2,1fr)}}
.ops-kpi{padding:13px 15px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(180deg,#10141C,#0B0E14)}
.ops-kpi b{display:block;font-size:22px;font-weight:750;font-variant-numeric:tabular-nums}
.ops-kpi span{font-size:10.5px;color:var(--faint);letter-spacing:.08em}
.ops-kpi.warn b{color:var(--b)}
.ops-kpi.bad b{color:var(--bad)}
.status-pill{display:inline-flex;align-items:center;gap:7px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);font-size:12px}
.status-pill.ok{color:var(--ok);border-color:#1d4a3a;background:#12211c}
.status-pill.bad{color:var(--bad);border-color:#4a1d1d;background:#211212}
.two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-top:16px}
@media (max-width:980px){.two-col{grid-template-columns:1fr}}
.jobs{width:100%;border-collapse:collapse;font-size:12px}
.jobs th{font-size:10px;letter-spacing:.1em;color:var(--faint);text-transform:uppercase;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line-soft)}
.jobs td{padding:7px 8px;border-bottom:1px solid var(--line-soft);color:var(--dim);font-variant-numeric:tabular-nums}
.jobs td.mono{font-family:var(--mono);font-size:11px}
.tag-running{color:var(--a)} .tag-pending{color:var(--b)} .tag-failed{color:var(--bad)} .tag-done{color:var(--ok)}
.problems li{margin:4px 0;color:var(--bad);font-size:12.5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:12.5px}
.kv .k{color:var(--faint)}
</style>
</head>
<body>
<main id="main">
<div class="wrap" style="padding-top:24px">
  <div style="display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap">
    <div>
      <div class="muted" style="letter-spacing:.2em;font-size:10.5px">OPS</div>
      <h1 data-i18n="admin.heading">Admin console</h1>
      <p class="muted" id="sub" style="margin-top:4px" data-i18n="admin.sub">Service health, queue, quota and season scheduler.</p>
    </div>
    <span style="margin-left:auto"></span>
    <span class="status-pill" id="overall"><span class="dot-live"></span><span data-i18n="common.loading">Loading…</span></span>
    <button class="btn" id="btnTick" type="button" data-i18n="admin.scheduler.tick">Run season tick now</button>
    <button class="btn primary" id="btnRefresh" type="button" data-i18n="admin.refresh">Refresh</button>
  </div>

  <div class="ops-grid" id="kpis"></div>
  <div id="problems" style="display:none;margin-top:12px" class="notice warn"></div>

  <div class="two-col">
    <div class="card pad">
      <h2 style="margin-top:0" data-i18n="admin.jobs.title">Queue jobs</h2>
      <table class="jobs" id="jobsTable">
        <thead><tr>
          <th data-i18n="admin.jobs.id">Job</th>
          <th data-i18n="admin.jobs.kind">Kind</th>
          <th data-i18n="admin.jobs.status">Status</th>
          <th data-i18n="admin.jobs.attempts">Attempts</th>
          <th data-i18n="admin.jobs.error">Error</th>
        </tr></thead>
        <tbody id="jobsBody"></tbody>
      </table>
      <div class="muted" id="jobsEmpty" style="display:none;padding:10px 0" data-i18n="admin.jobs.empty">No jobs yet — create a match.</div>
    </div>
    <div>
      <div class="card pad">
        <h2 style="margin-top:0" data-i18n="admin.scheduler.title">Season scheduler</h2>
        <div class="kv" id="schedulerBox"></div>
      </div>
      <div class="card pad" style="margin-top:16px">
        <h2 style="margin-top:0" data-i18n="admin.quota.title">Quota usage (this identity)</h2>
        <div class="kv" id="quotaBox"></div>
      </div>
      <div class="card pad" style="margin-top:16px">
        <h2 style="margin-top:0" data-i18n="admin.site.title">Site totals</h2>
        <div class="kv" id="siteBox"></div>
      </div>
    </div>
  </div>

  <div class="footer-slot"></div>
</div>
</main>
<script type="module" src="./src/admin.js"></script>
</body>
</html>
