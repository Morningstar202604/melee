<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>导播台 · melee 转播台</title>
<link rel="stylesheet" href="./src/theme.css">
<style>
.layout{display:grid;grid-template-columns:290px 1fr 340px;gap:0;height:calc(100vh - 56px)}
@media (max-width:1000px){.layout{grid-template-columns:1fr;height:auto}}
.col{overflow:auto;padding:16px 18px;border-right:1px solid #161A24;min-height:0}
.col:last-child{border-right:none;border-left:1px solid #161A24}
.mi{padding:11px 13px;border-radius:9px;border:1px solid var(--line);background:#0C1017;cursor:pointer;margin-bottom:8px;
  transition:border-color .15s;width:100%;text-align:left}
.mi:hover{border-color:#3A4356}
.mi.on{border-color:var(--a);box-shadow:inset 2px 0 0 var(--a)}
.mi .id{font-family:var(--mono);font-size:11px;color:var(--faint)}
.mi .p{font-size:13px;color:#D6DBE6;margin-top:3px}
.mi .m{font-size:11px;color:var(--faint);margin-top:4px;display:flex;gap:10px}
.shots{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.shot{padding:12px 10px;border-radius:9px;border:1px solid var(--line);background:#0C1017;cursor:pointer;text-align:center;font-size:12.5px;color:#C4CBDA}
.shot:hover{border-color:#3A4356;background:#111722}
.shot.on{border-color:var(--a);background:rgba(34,211,238,.08);color:var(--a)}
.shot small{display:block;font-size:10px;color:var(--faint);margin-top:3px}
.shot.on small{color:rgba(34,211,238,.7)}
.field-row{display:flex;gap:8px;margin-bottom:10px}
.field-row .input{flex:1}
.log{font-family:var(--mono);font-size:11.5px;line-height:1.75;color:#8A93A5;white-space:pre-wrap;word-break:break-all;
  background:#0A0D13;border:1px solid var(--line-soft);border-radius:10px;padding:10px 12px;height:240px;overflow:auto}
.log b{color:var(--a)}
.log .t{color:var(--faint)}
.cue-row{padding:8px 10px;border-radius:7px;background:#0A0D13;border:1px solid #171C26;margin-bottom:6px;font-size:11.5px}
.cue-row .k{color:var(--a)}
.manual{color:var(--b)}
.kv{display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim);padding:6px 0;border-bottom:1px solid var(--line-soft)}
.kv:last-child{border-bottom:none}
.kv b{color:#D6DBE6;font-variant-numeric:tabular-nums}
.hotkeys{font-size:11px;color:var(--faint);line-height:1.9}
.hotkeys kbd{display:inline-block;min-width:20px;text-align:center;padding:1px 6px;border-radius:5px;border:1px solid var(--line);
  background:#0C1017;font-family:var(--mono);font-size:10.5px;color:var(--dim)}
</style>
</head>
<body>
<main id="main">
<div class="layout">
  <div class="col">
    <h2 style="margin-top:0">正在直播</h2>
    <div id="matchList"><div class="muted">加载中…</div></div>
    <button class="btn" id="refresh" style="width:100%;margin-top:6px">刷新列表</button>

    <h2 style="margin-top:22px">快捷键</h2>
    <div class="hotkeys">
      <div><kbd>1</kbd>–<kbd>5</kbd> 选镜头</div>
      <div><kbd>Enter</kbd> 切镜 · <kbd>Esc</kbd> 清空备注</div>
      <div><kbd>R</kbd> 刷新本场数据</div>
    </div>
  </div>

  <div class="col">
    <div class="field-row">
      <input class="input" id="matchId" placeholder="matchId（也可从左侧选）" aria-label="比赛 ID" />
      <button class="btn" id="open">打开</button>
      <a class="btn" id="btnWatch" href="watch.html" target="_blank" rel="noreferrer noopener">观战页</a>
    </div>

    <h2>镜头</h2>
    <div class="shots" id="shots">
      <div class="shot" data-shot="wide" role="button" tabindex="0">广角<small>默认</small></div>
      <div class="shot" data-shot="close" role="button" tabindex="0">特写<small>看某人</small></div>
      <div class="shot" data-shot="thought" role="button" tabindex="0">内心戏<small>展开思考</small></div>
      <div class="shot" data-shot="reveal" role="button" tabindex="0">揭晓<small>关键信息</small></div>
      <div class="shot" data-shot="slowmo" role="button" tabindex="0">慢镜<small>收尾</small></div>
    </div>

    <div class="field-row">
      <input class="input" id="target" placeholder="目标选手（可空）" aria-label="目标选手" />
      <input class="input" id="duration" value="1200" style="width:96px" inputmode="numeric" aria-label="持续毫秒" />
    </div>
    <div class="field-row">
      <input class="input" id="note" placeholder="给回放看的备注（可选）" aria-label="备注" />
      <button class="btn primary" id="push">切镜</button>
    </div>
    <div class="muted" id="status" role="status"></div>

    <h2>实时事件</h2>
    <div class="log" id="log">未连接。</div>
  </div>

  <div class="col">
    <h2 style="margin-top:0">本场统计</h2>
    <div class="card pad" style="margin-bottom:16px">
      <div class="kv"><span>自动切镜</span><b id="autoCount">0</b></div>
      <div class="kv"><span>人工切镜</span><b id="manualCount" style="color:var(--b)">0</b></div>
      <div class="kv"><span>事件数</span><b id="eventCount">0</b></div>
      <div class="kv"><span>连接</span><b id="conn" class="muted">未连接</b></div>
    </div>

    <h2>人工记录</h2>
    <div id="cueList"><div class="muted">还没有人工切镜。</div></div>
  </div>
</div>
</main>
<script type="module" src="./src/director.js"></script>
</body>
</html>
