name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Verify all gates
        run: bash scripts/verify_all.sh
      - name: Smoke test (single port)
        run: |
          MELEE_DB=/tmp/ci.db MELEE_QUOTA_MATCHES=100 python scripts/serve.py --port 8099 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8099/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8099/health
          curl -fsS http://127.0.0.1:8099/ | grep -q "转播台"
          curl -fsS http://127.0.0.1:8099/games | grep -q "codenames"
          curl -fsS -X POST http://127.0.0.1:8099/matches \
            -H "Content-Type: application/json" \
            -d '{"game":"tic-tac-toe","seed":1,"players":[{"id":"A"},{"id":"B"}]}' | grep -q matchId

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t melee:ci .
      - name: Smoke test
        run: |
          docker run -d --name melee -p 8099:8099 -e MELEE_AUTH=off melee:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8099/health; then exit 0; fi
            sleep 1
          done
          docker logs melee
          exit 1
